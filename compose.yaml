services:
  hub:
    build: .
    restart: unless-stopped
    environment:
      HUB_ADMIN_PASSWORD: ${HUB_ADMIN_PASSWORD:?Set HUB_ADMIN_PASSWORD in .env}
      HUB_DATA_DIR: /app/data
      HUB_RCLONE_CONFIG: /app/data/rclone.conf
      HUB_BACKUP_MAX_UPLOAD_BYTES: ${HUB_BACKUP_MAX_UPLOAD_BYTES:-1073741824}
      HUB_BACKUP_MAX_STORAGE_BYTES: ${HUB_BACKUP_MAX_STORAGE_BYTES:-10737418240}
      HUB_BACKUP_RETENTION_DAYS: ${HUB_BACKUP_RETENTION_DAYS:-7}
      HUB_BACKUP_TRANSFER_TIMEOUT_SECONDS: ${HUB_BACKUP_TRANSFER_TIMEOUT_SECONDS:-3600}
    volumes:
      - hub_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?Set HUB_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      HUB_BACKUP_MAX_UPLOAD_BYTES: ${HUB_BACKUP_MAX_UPLOAD_BYTES:-1073741824}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      hub:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hub_data:
  caddy_data:
  caddy_config:
