name: Validate hub

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            agent/requirements.txt
            tests/requirements-browser.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: pip install -r backend/requirements-dev.txt -r agent/requirements.txt -r tests/requirements-browser.txt
      - run: sudo apt-get update && sudo apt-get install -y rclone
      - run: python -m pytest backend/tests agent/tests tests -q
      - run: node --test
        working-directory: templates/node
      - run: go test -race ./...
        working-directory: templates/go
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
